name: Auto Backup

on:
  push:
    branches: [ "main" ]
    paths:
      - "**.lua"
      - ".github/workflows/*.yml"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: 检测变更文件并打包
        id: pack
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep '\.lua$' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_ENV
            exit 0
          fi
          for file in $CHANGED; do
            filename=$(basename "$file" .lua)
            zip -r "${filename}.zip" "$file"
            echo "files=$CHANGED" >> $GITHUB_ENV
          done

      - name: 发送到 Telegram
        if: env.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for file in ${{ env.files }}; do
            filename=$(basename "$file" .lua)
            curl --retry 3 --retry-delay 2 \
                 -F "chat_id=$TELEGRAM_CHAT_ID" \
                 -F "document=@${filename}.zip" \
                 -F "caption=📄 $file%0A🕐 $(date +'%Y-%m-%d %H:%M:%S')" \
                 https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument
          done
