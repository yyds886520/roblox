name: Get Specific File

on:
  workflow_dispatch:
    inputs:
      filename:
        description: '文件名（带 .lua 后缀）'
        required: true
        type: string

jobs:
  get-file:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 查找并打包指定文件
        run: |
          FILE="${{ github.event.inputs.filename }}"
          FOUND=$(find . -name "$FILE" | head -n 1)

          if [ -z "$FOUND" ]; then
            echo "file_exists=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "file_exists=true" >> $GITHUB_ENV
          zip -r "$FILE.zip" "$FOUND"

      - name: 发送到 Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ env.file_exists }}" == "true" ]]; then
            curl --retry 3 --retry-delay 2 \
                 -F "chat_id=$TELEGRAM_CHAT_ID" \
                 -F "document=@${{ github.event.inputs.filename }}.zip" \
                 -F "caption=📄 ${{ github.event.inputs.filename }}" \
                 https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument
          else
            curl -F "chat_id=$TELEGRAM_CHAT_ID" \
                 -F "text=❌ 文件不存在: ${{ github.event.inputs.filename }}" \
                 https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage
          fi
